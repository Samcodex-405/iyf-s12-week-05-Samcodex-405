<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 1: Color Changer</title>
    <style>
        body { font-family: sans-serif; padding: 24px; }
        h1, h2, h3 { color: var(--heading-color, #222); }
    </style>
</head>
<body>
    <h1>Heading One</h1>
    <h2>Heading Two</h2>
    <h3>Heading Three</h3>
    <button id="color-btn">Change heading colors</button>
    <script>
        function randomHex() {
            return "#" + Math.floor(Math.random() * 0x1000000).toString(16).padStart(6, "0");
        }
        document.getElementById("color-btn").addEventListener("click", function () {
            document.querySelectorAll("h1, h2, h3").forEach(function (h) {
                h.style.setProperty("--heading-color", randomHex());
            });
        });
    </script>
</body>
</html>
