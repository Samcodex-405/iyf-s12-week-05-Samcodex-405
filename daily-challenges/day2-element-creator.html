<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2: Dynamic Element Creator</title>
    <style> body { font-family: sans-serif; padding: 24px; } p { margin: 8px 0; } </style>
</head>
<body>
    <h1>Dynamic Element Creator</h1>
    <button id="add-btn">Add paragraph</button>
    <div id="output"></div>
    <script>
        const output = document.getElementById("output");
        let n = 0;
        document.getElementById("add-btn").addEventListener("click", function () {
            n++;
            const p = document.createElement("p");
            p.textContent = "Paragraph " + n + " ";
            const del = document.createElement("button");
            del.textContent = "Delete";
            del.className = "delete-btn";
            p.appendChild(del);
            output.appendChild(p);
        });
        output.addEventListener("click", function (event) {
            if (event.target.matches(".delete-btn")) event.target.parentElement.remove();
        });
    </script>
</body>
</html>
